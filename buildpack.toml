api = "0.7"

[buildpack]
  homepage = "https://github.com/paketo-buildpacks/nodejs"
  id = "neeto-deploy/nodejs"
  name = "Paketo Buildpack for Node.js"
  version = "9.15.11"

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/paketo-buildpacks/nodejs/blob/main/LICENSE"

[metadata]
  include-files = ["buildpack.toml"]

[[order]]

  [[order.group]]
    id = "neeto-deploy/node-engine"
    version = "7.12.0"

  [[order.group]]
    id = "neeto-deploy/yarn"
    version = "2.3.1"

  [[order.group]]
    id = "neeto-deploy/yarn-install"
    version = "2.7.1"

  [[order.group]]
    id = "paketo-buildpacks/node-run-script"
    optional = true
    version = "2.3.12"

  [[order.group]]
    id = "paketo-buildpacks/node-start"
    optional = true
    version = "2.5.12"

  [[order.group]]
    id = "neeto-deploy/yarn-start"
    optional = true
    version = "2.4.11"

[[order]]

  [[order.group]]
    id = "neeto-deploy/node-engine"
    version = "7.12.0"

  [[order.group]]
    id = "paketo-buildpacks/npm-install"
    version = "2.2.5"

  [[order.group]]
    id = "paketo-buildpacks/node-run-script"
    optional = true
    version = "2.3.12"

  [[order.group]]
    id = "paketo-buildpacks/node-start"
    optional = true
    version = "2.5.12"

  [[order.group]]
    id = "paketo-buildpacks/npm-start"
    optional = true
    version = "2.3.11"

[[order]]

  [[order.group]]
    id = "neeto-deploy/node-engine"
    version = "7.12.0"

  [[order.group]]
    id = "paketo-buildpacks/node-start"
    version = "2.5.12"
